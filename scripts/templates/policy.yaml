- title: Terms & Conditions
  identifier: terms-conditions
  type: page
  active: true
  content: |
    <div class="policy-page" style="max-width: 800px; margin: 0 auto; line-height: 1.7;">
      <h1>Terms & Conditions</h1>
      <p><em>Last updated: {{year}}</em></p>

      <h2>1. General</h2>
      <p>These Terms and Conditions govern your use of {{store_url}} and your purchase of products from {{store_name}}. By accessing our website and placing an order, you agree to be bound by these terms.</p>

      <h2>2. Business Information</h2>
      <p>{{store_name}} is an online retailer operating from {{country}}. For any legal correspondence, please contact us at:</p>
      <ul>
        <li>Email: <strong>support@{{store_url}}</strong></li>
      </ul>

      <h2>3. Products & Pricing</h2>
      <ul>
        <li>All prices are listed in <strong>USD</strong> and include applicable taxes where required by law</li>
        <li>Prices may be updated at any time without prior notice</li>
        <li>Product images are for illustration purposes; actual products may vary slightly</li>
        <li>We make every effort to display accurate colors, but we cannot guarantee that your screen's display is accurate</li>
      </ul>

      <h2>4. Order Acceptance & Contract Formation</h2>
      <ul>
        <li>Placing an item in your cart does not reserve it</li>
        <li>A binding contract is formed only when we send you the <strong>order confirmation email</strong></li>
        <li>We reserve the right to refuse or cancel orders for reasons including: product unavailability, pricing errors, or suspected fraud</li>
        <li>If we cancel an order, we will refund any payment made in full</li>
      </ul>

      <h2>5. Payment Terms</h2>
      <ul>
        <li>Payment is due at the time of order</li>
        <li>We accept Visa, Mastercard, PayPal, Apple Pay, and Google Pay</li>
        <li>All transactions are processed securely by our payment partners</li>
        <li>We do not store full payment card details</li>
      </ul>

      <h2>6. Delivery & Risk</h2>
      <ul>
        <li>Estimated delivery times are provided as guidelines and are not guaranteed</li>
        <li>Risk of loss and title for products pass to you upon delivery</li>
        <li>International orders may be subject to customs fees and import duties, which are your responsibility</li>
      </ul>

      <h2>7. Right of Withdrawal (EU Customers)</h2>
      <p>Under EU consumer law, you have the right to withdraw from your purchase within <strong>14 calendar days</strong> without giving any reason. This right applies to consumers in the European Union and European Economic Area.</p>
      <p>To exercise this right, contact us at <strong>support@{{store_url}}</strong> within 14 days of receiving your order. You must return the goods within 14 days of notifying us.</p>

      <h2>8. Warranty & Liability</h2>
      <ul>
        <li>Products are covered by a statutory warranty of conformity as required by applicable law</li>
        <li>Our liability is limited to the purchase price of the product</li>
        <li>We are not liable for indirect, incidental, or consequential damages</li>
        <li>Nothing in these terms excludes or limits liability for death or personal injury caused by negligence, fraud, or any other liability that cannot be excluded by law</li>
      </ul>

      <h2>9. Intellectual Property</h2>
      <p>All content on this website — including text, graphics, logos, images, and software — is the property of {{store_name}} and is protected by international copyright laws. You may not reproduce, distribute, or create derivative works without our written permission.</p>

      <h2>10. Governing Law & Dispute Resolution</h2>
      <ul>
        <li>These terms are governed by the laws of {{country}}</li>
        <li>For EU customers: disputes may be resolved through the European Commission's Online Dispute Resolution (ODR) platform at <a href="https://ec.europa.eu/consumers/odr/">https://ec.europa.eu/consumers/odr/</a></li>
        <li>We commit to resolving complaints amicably before pursuing legal action</li>
      </ul>

      <h2>11. Changes to Terms</h2>
      <p>We reserve the right to modify these terms at any time. Changes will be effective immediately upon posting. Continued use of our website after changes constitutes acceptance of the new terms.</p>

      <h2>12. Contact</h2>
      <p>For questions about these terms, contact us at <strong>support@{{store_url}}</strong>.</p>
    </div>

