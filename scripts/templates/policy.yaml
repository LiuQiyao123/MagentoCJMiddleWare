# 6. Frequently Asked Questions
# ════════════════════════════════════════════════════════════
- title: Frequently Asked Questions
  identifier: faq
  type: page
  active: true
  content: |
    <div class="faq-page" style="max-width: 700px; margin: 0 auto; line-height: 1.7;">
      <h1>Frequently Asked Questions</h1>

      <h3>How do I place an order?</h3>
      <p>Browse our products → Add items to your cart → Proceed to checkout → Enter your shipping details → Complete payment. You will receive an order confirmation email once your order is placed.</p>

      <h3>What payment methods do you accept?</h3>
      <p>We accept Visa, Mastercard, American Express, PayPal, Apple Pay, and Google Pay.</p>

      <h3>How can I track my order?</h3>
      <p>Once shipped, you will receive a tracking number via email. You can track your order through your account dashboard or by contacting our support team.</p>

      <h3>Can I change or cancel my order?</h3>
      <p>Orders can be modified or canceled within 1 hour of placement. After that, the order enters processing and cannot be changed. Contact us immediately if you need to make changes.</p>

      <h3>How long does delivery take?</h3>
      <p>Standard shipping takes 7–15 business days. Express shipping takes 3–7 business days. Processing time is 1–3 business days.</p>

      <h3>Do you ship to my country?</h3>
      <p>We ship to the United States, Japan, European Union, United Kingdom, and select other countries. Check availability at checkout.</p>

      <h3>What is your return policy?</h3>
      <p>We offer a 30-day return window for most items. EU customers also have a statutory 14-day right of withdrawal. See our <a href="{{store_url}}/return-policy">Return Policy</a> for full details.</p>

      <h3>Will I have to pay customs fees?</h3>
      <p>International orders may be subject to import duties and taxes. These charges are the responsibility of the customer. Customs policies vary by country.</p>

      <h3>How do I contact customer support?</h3>
      <p>Email us at <strong>support@{{store_url}}</strong>. We aim to respond within 24 hours on business days.</p>

      <h3>Is my personal information secure?</h3>
      <p>Yes. We use SSL encryption and follow strict data protection practices in compliance with GDPR. See our <a href="{{store_url}}/privacy-policy">Privacy Policy</a> for details.</p>
    </div>

