# 4. Shipping Policy
# ════════════════════════════════════════════════════════════
- title: Shipping Policy
  identifier: shipping-policy
  type: page
  active: true
  content: |
    <div class="policy-page" style="max-width: 800px; margin: 0 auto; line-height: 1.7;">
      <h1>Shipping Policy</h1>
      <p><em>Last updated: {{year}}</em></p>

      <h2>1. Processing Time</h2>
      <p>Orders are processed within <strong>1–3 business days</strong> after payment confirmation. During peak periods (holiday seasons, sales events), processing may take up to 5 business days.</p>

      <h2>2. Shipping Options & Delivery Times</h2>
      <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
        <tr style="background: #f0f0f0;">
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Method</th>
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Est. Delivery</th>
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Cost</th>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Standard Shipping</td>
          <td style="border: 1px solid #ddd; padding: 10px;">7–15 business days</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Calculated at checkout</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Express Shipping</td>
          <td style="border: 1px solid #ddd; padding: 10px;">3–7 business days</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Calculated at checkout</td>
        </tr>
      </table>
      <p>Please note: delivery times are estimates and not guaranteed. Delays may occur due to customs processing, weather, or other unforeseen circumstances.</p>

      <h2>3. Free Shipping</h2>
      <p>Free standard shipping is available on orders over <strong>$59</strong>. This offer applies to standard shipping only and may be modified or discontinued at any time.</p>

      <h2>4. Shipping Destinations</h2>
      <p>We currently ship to the following regions:</p>
      <ul>
        <li><strong>United States</strong> — all 50 states</li>
        <li><strong>Japan</strong> — nationwide</li>
        <li><strong>European Union</strong> — all member states</li>
        <li><strong>United Kingdom</strong></li>
        <li><strong>Select other countries</strong> — available at checkout</li>
      </ul>

      <h2>5. Order Tracking</h2>
      <p>Once your order is shipped, you will receive a confirmation email with a tracking number. Tracking information typically becomes available within 24–48 hours of shipment.</p>

      <h2>6. Customs, Duties & Taxes</h2>
      <ul>
        <li>International orders may be subject to import duties, customs fees, and local taxes</li>
        <li>These charges are the <strong>responsibility of the customer</strong></li>
        <li>Customs policies vary by country; please check with your local customs office</li>
        <li>We are not responsible for delays caused by customs clearance</li>
      </ul>

      <h2>7. Incorrect Address</h2>
      <p>We are not responsible for packages delivered to an incorrect address provided by the customer. Please verify your shipping address carefully before completing your order.</p>

      <h2>8. Lost or Damaged Packages</h2>
      <ul>
        <li><strong>Lost packages:</strong> If your tracking shows no movement for 15 business days, contact us and we will investigate</li>
        <li><strong>Damaged packages:</strong> If your order arrives damaged, contact us within 48 hours with photos of the damage and packaging</li>
      </ul>
    </div>

