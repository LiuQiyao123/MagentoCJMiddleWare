# 7. Footer Block
# ════════════════════════════════════════════════════════════
- title: Footer Links
  identifier: footer-info
  type: block
  active: true
  content: |
    <div class="footer-links" style="text-align: center; padding: 15px 10px;">
      <a href="{{store_url}}/about-us">About Us</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/privacy-policy">Privacy Policy</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/return-policy">Returns</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/shipping-policy">Shipping</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/faq">FAQ</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/terms-conditions">Terms</a> &nbsp;|&nbsp;
      <a href="{{store_url}}/contact-us">Contact</a>
      <p style="margin-top: 10px; color: #888; font-size: 13px;">&copy; {{year}} {{store_name}}. All rights reserved.</p>
    </div>
