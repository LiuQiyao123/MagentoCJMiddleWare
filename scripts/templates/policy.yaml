# 3. Return & Refund Policy
# ════════════════════════════════════════════════════════════
- title: Return & Refund Policy
  identifier: return-policy
  type: page
  active: true
  content: |
    <div class="policy-page" style="max-width: 800px; margin: 0 auto; line-height: 1.7;">
      <h1>Return & Refund Policy</h1>
      <p><em>Last updated: {{year}}</em></p>

      <h2>1. Return Window</h2>
      <p>You have <strong>30 days</strong> from the date of delivery to request a return. For EU customers, your statutory <strong>14-day right of withdrawal</strong> applies as outlined in our Terms & Conditions.</p>

      <h2>2. Return Conditions</h2>
      <ul>
        <li>Items must be unused, unwashed, and in original condition</li>
        <li>All tags and original packaging must be intact</li>
        <li>Proof of purchase (order number) is required</li>
      </ul>

      <h2>3. Non-Returnable Items</h2>
      <ul>
        <li>Intimate apparel and swimwear (hygiene reasons)</li>
        <li>Items marked as final sale or clearance</li>
        <li>Gift cards</li>
        <li>Digital/downloadable products</li>
      </ul>

      <h2>4. How to Start a Return</h2>
      <ol>
        <li>Contact us at <strong>support@{{store_url}}</strong> with your order number</li>
        <li>We will provide a return authorization and shipping instructions</li>
        <li>Ship the item to the address provided</li>
        <li>Once received and inspected, we process your refund</li>
      </ol>

      <h2>5. Refund Processing</h2>
      <ul>
        <li>Approved refunds are processed within <strong>5–7 business days</strong></li>
        <li>Refunds are issued to your original payment method</li>
        <li>You will receive a confirmation email once the refund is complete</li>
      </ul>

      <h2>6. Return Shipping</h2>
      <p>Return shipping costs are the responsibility of the customer unless the item is defective or incorrect. For EU customers exercising the 14-day right of withdrawal, the direct cost of return shipping is borne by the customer unless otherwise agreed.</p>

      <h2>7. Defective or Incorrect Items</h2>
      <p>If you receive a defective or incorrect item, please contact us immediately. We will cover all return shipping costs and send a replacement or issue a full refund, including original shipping costs.</p>

      <h2>8. Exchanges</h2>
      <p>We do not offer direct exchanges. Please return the original item for a refund and place a new order.</p>

      <h2>9. Contact</h2>
      <p>Email: <strong>support@{{store_url}}</strong></p>
    </div>

