# 1. Privacy Policy — GDPR Compliant
# ════════════════════════════════════════════════════════════
# ⚠️ 以下内容需要你确认：
#    - DPO 邮箱 (dpo@xxx) — 你可能没有专门设 DPO，改为 support@ 也行
#    - 数据保留期（5年）— 瞎猜的，税务要求各国不同
#    - 第三方服务商列表（PayPal/Stripe 等）— 不确认你实际用哪些
#    - {{country}} — 瞎编占位，需要替换为实际注册国家
- title: Privacy Policy
  identifier: privacy-policy
  type: page
  active: true
  content: |
    <div class="policy-page" style="max-width: 800px; margin: 0 auto; line-height: 1.7;">
      <h1>Privacy Policy</h1>
      <p><em>Last updated: {{year}}</em></p>

      <h2>1. Who We Are</h2>
      <p>{{store_name}} ("we", "us", "our") operates the website at <strong>{{store_url}}</strong>. We are the data controller responsible for your personal data.</p>
      <p>For data protection matters, you can contact us at:</p>
      <ul>
        <li>Email: <strong>dpo@{{store_url}}</strong></li>
        <li>Our Data Protection Officer (DPO) is available for all GDPR-related inquiries.</li>
      </ul>

      <h2>2. What Personal Data We Collect</h2>
      <p>We may collect, use, store and transfer the following categories of personal data:</p>

      <h3>Identity Data</h3>
      <ul>
        <li>First name, last name, username</li>
        <li>Billing and shipping address</li>
        <li>Phone number</li>
      </ul>

      <h3>Financial Data</h3>
      <ul>
        <!-- ⚠️ 

      <h3>Technical Data</h3>
      <ul>
        <li>IP address</li>
        <li>Browser type and version</li>
        <li>Device operating system</li>
        <li>Time zone setting</li>
        <li>Browsing behavior on our site (pages viewed, time spent, click patterns)</li>
      </ul>

      <h3>Profile Data</h3>
      <ul>
        <li>Your username and password</li>
        <li>Purchase history and preferences</li>
        <li>Feedback and survey responses</li>
      </ul>

      <h3>Marketing & Communications Data</h3>
      <ul>
        <li>Your email preferences</li>
        <li>Communication history with our support team</li>
      </ul>

      <h2>3. How We Collect Your Data</h2>
      <p>We collect data through:</p>
      <ul>
        <li><strong>Direct interactions:</strong> When you create an account, place an order, contact our support, subscribe to our newsletter, or complete a survey</li>
        <li><strong>Automated technologies:</strong> Cookies, server logs, and similar tracking technologies when you browse our site</li>
        <li><strong>Third parties:</strong> Payment processors, analytics providers (Google Analytics), and advertising networks</li>
      </ul>

      <h2>4. Legal Basis for Processing (GDPR)</h2>
      <p>Under the General Data Protection Regulation (GDPR), we process your personal data on the following legal bases:</p>
      <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
        <tr style="background: #f0f0f0;">
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Purpose</th>
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Lawful Basis</th>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Order processing and delivery</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Performance of a contract</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Payment processing</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Performance of a contract</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Sending order updates</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Performance of a contract</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Marketing emails (with consent)</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Consent</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Fraud prevention</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Legitimate interest</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Website analytics</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Consent (via cookie banner)</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Legal compliance</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Legal obligation</td>
        </tr>
      </table>

      <h2>5. Cookies and Tracking Technologies</h2>
      <p>Our website uses cookies to enhance your browsing experience. We use:</p>
      <ul>
        <li><strong>Essential cookies:</strong> Required for the website to function (shopping cart, login session)</li>
        <li><strong>Analytics cookies:</strong> To understand how you use our site (Google Analytics)</li>
        <li><strong>Functional cookies:</strong> To remember your preferences</li>
        <li><strong>Marketing cookies:</strong> To show you relevant advertisements</li>
      </ul>
      <p>You can control cookies through your browser settings. A cookie consent banner will appear on your first visit to our site where you can manage your preferences.</p>

      <h2>6. How We Use Your Data</h2>
      <p>We use your personal data for the following purposes:</p>
      <ul>
        <li>To process and fulfill your orders (including payment, shipping, and returns)</li>
        <li>To manage your account and provide customer support</li>
        <li>To send you order confirmations, shipping updates, and service messages</li>
        <li>To detect and prevent fraud</li>
        <li>To improve our website, products, and services</li>
        <li>To comply with legal and regulatory obligations</li>
        <li><strong>With your explicit consent:</strong> To send you marketing communications and newsletters</li>
      </ul>

      <h2>7. Data Retention</h2>
      <p>We will only retain your personal data for as long as necessary to fulfill the purposes we collected it for, including for the purposes of satisfying any legal, accounting, or reporting requirements.</p>
      <ul>
        <li>Order data: Retained for <strong>5 years</strong> after the last order (tax/legal requirements)</li>
        <li>Account data: Retained until you delete your account</li>
        <li>Marketing data: Retained until you unsubscribe</li>
        <li>Cookie data: As specified in our cookie consent tool</li>
      </ul>

      <h2>8. Third-Party Data Sharing</h2>
      <p>We may share your data with the following categories of third parties for legitimate business purposes:</p>

      <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
        <tr style="background: #f0f0f0;">
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Category</th>
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Examples</th>
          <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Purpose</th>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Payment Processors</td>
          <td style="border: 1px solid #ddd; padding: 10px;">PayPal, Stripe, Adyen</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Payment processing</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Shipping Carriers</td>
          <td style="border: 1px solid #ddd; padding: 10px;">USPS, FedEx, DHL, Japan Post</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Order delivery</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Analytics Providers</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Google Analytics</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Website analysis</td>
        </tr>
        <tr>
          <td style="border: 1px solid #ddd; padding: 10px;">Email Service</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Mailchimp, SendGrid</td>
          <td style="border: 1px solid #ddd; padding: 10px;">Transactional emails</td>
        </tr>
      </table>
      <p>We require all third parties to respect the security of your personal data and to treat it in accordance with the law.</p>
      <p><strong>We do not sell your personal data to any third party.</strong></p>

      <h2>9. International Data Transfers</h2>
      <p>Your personal data may be transferred to and processed in countries outside the European Economic Area (EEA), including the United States, China, and Japan. When we transfer your data internationally, we ensure appropriate safeguards are in place, including:</p>
      <ul>
        <li>Standard Contractual Clauses (SCCs) approved by the European Commission</li>
        <li>Data Processing Agreements (DPAs) with our service providers</li>
        <li>Adequacy decisions where applicable</li>
      </ul>

      <h2>10. Your GDPR Rights</h2>
      <p>If you are located in the European Economic Area (EEA) or the United Kingdom, you have the following rights under GDPR:</p>

      <ol>
        <li><strong>Right to Access:</strong> Request a copy of the personal data we hold about you</li>
        <li><strong>Right to Rectification:</strong> Request correction of inaccurate or incomplete data</li>
        <li><strong>Right to Erasure (Right to be Forgotten):</strong> Request deletion of your personal data</li>
        <li><strong>Right to Restrict Processing:</strong> Request restriction of how we process your data</li>
        <li><strong>Right to Data Portability:</strong> Request transfer of your data to another service</li>
        <li><strong>Right to Object:</strong> Object to processing based on legitimate interests or direct marketing</li>
        <li><strong>Right to Withdraw Consent:</strong> Withdraw consent at any time (without affecting the lawfulness of previous processing)</li>
        <li><strong>Right to Complain:</strong> Lodge a complaint with your local data protection supervisory authority</li>
      </ol>

      <p>To exercise any of these rights, please contact us at <strong>dpo@{{store_url}}</strong>. We will respond within <strong>30 days</strong> as required by GDPR.</p>

      <h2>11. Data Security</h2>
      <p>We have implemented appropriate technical and organizational security measures to protect your personal data, including:</p>
      <ul>
        <li>SSL/TLS encryption for all data transmitted between your browser and our servers</li>
        <li>Encrypted storage of sensitive data</li>
        <li>Regular security audits and vulnerability assessments</li>
        <li>Access controls restricting data access to authorized personnel only</li>
      </ul>

      <h2>12. Data Breach Notification</h2>
      <p>In the event of a data breach that poses a risk to your rights and freedoms, we will notify the relevant supervisory authority within 72 hours and, where required, inform you directly without undue delay.</p>

      <h2>13. Children's Privacy</h2>
      <p>Our services are not intended for individuals under the age of 16. We do not knowingly collect personal data from children. If you become aware that a child has provided us with personal data, please contact us immediately.</p>

      <h2>14. Changes to This Policy</h2>
      <p>We may update this Privacy Policy from time to time. We will notify you of any significant changes by posting the updated policy on this page with a new "Last updated" date.</p>

      <h2>15. Contact & DPO</h2>
      <p>For any questions, concerns, or to exercise your GDPR rights:</p>
      <ul>
        <li>Email (DPO): <strong>dpo@{{store_url}}</strong></li>
        <li>Email (Support): <strong>support@{{store_url}}</strong></li>
      </ul>
    </div>

