# 5. About Us
# ════════════════════════════════════════════════════════════
- title: About Us
  identifier: about-us
  type: page
  active: true
  content: |
    <div class="about-page" style="max-width: 700px; margin: 0 auto; line-height: 1.7;">
      <h1>About {{store_name}}</h1>
      <p>Welcome to {{store_name}} — your destination for quality products at affordable prices.</p>
      <p>We are an independent online retailer committed to bringing you carefully curated products sourced from trusted suppliers around the world. Whether you are in the US, Japan, Europe, or beyond, we strive to deliver a seamless shopping experience.</p>

      <h2>Our Mission</h2>
      <p>To make quality products accessible to everyone, everywhere, without the premium price tag. We believe great style and functionality should not break the bank.</p>

      <h2>What Sets Us Apart</h2>
      <ul>
        <li>Carefully selected product range</li>
        <li>Competitive pricing through efficient supply chain</li>
        <li>Customer-first approach with dedicated support</li>
        <li>Secure and hassle-free checkout</li>
      </ul>

      <h2>Contact Us</h2>
      <p>Have questions or feedback? We'd love to hear from you at <strong>support@{{store_url}}</strong>.</p>
    </div>

