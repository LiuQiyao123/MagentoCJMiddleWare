# Contact page template
- title: Contact Us
  identifier: contact-us
  type: page
  active: true
  content: |
    <div class="contact-page" style="max-width: 700px; margin: 0 auto; padding: 40px 20px;">
      <h1 style="text-align: center; margin-bottom: 30px;">Contact Us</h1>
      <p style="text-align: center; color: #666; margin-bottom: 40px;">
        Have a question? We'd love to hear from you. Send us a message and we'll respond as soon as possible.
      </p>

      <div style="display: grid; gap: 20px; margin-bottom: 40px;">
        <div style="display: flex; align-items: center; gap: 15px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
          <span style="font-size: 24px;">📧</span>
          <div>
            <strong>Email</strong><br>
            <a href="mailto:support@{{store_url}}" style="color: #333;">support@{{store_url}}</a>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 15px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
          <span style="font-size: 24px;">🕐</span>
          <div>
            <strong>Business Hours</strong><br>
            Monday – Friday: 9:00 AM – 6:00 PM (EST)
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 15px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
          <span style="font-size: 24px;">⚡</span>
          <div>
            <strong>Response Time</strong><br>
            We typically respond within 24 hours
          </div>
        </div>
      </div>
    </div>
