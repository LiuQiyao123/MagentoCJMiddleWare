# Homepage template — English
# For dropshipping stores targeting US/Japan/Europe markets
# Apply via: cms.apply_template("homepage")

- title: Home
  identifier: home
  type: page
  active: true
  page_layout: 1column
  content: |
    <div class="homepage">
      <!-- Hero Banner -->
      <section class="hero-banner" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 80px 20px; text-align: center; color: #fff;">
        <h1 style="font-size: 42px; margin-bottom: 16px; font-weight: 700;">Welcome to {{store_name}}</h1>
        <p style="font-size: 20px; opacity: 0.9; margin-bottom: 35px; max-width: 600px; margin-left: auto; margin-right: auto;">
          Quality products curated just for you
        </p>
        <a href="/shop" class="btn" style="
          display: inline-block;
          padding: 16px 48px;
          background: #fff;
          color: #333;
          text-decoration: none;
          border-radius: 50px;
          font-size: 18px;
          font-weight: 600;
          transition: transform 0.2s;
        ">Shop Now →</a>
      </section>

      <!-- Features Section -->
      <section class="features" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 60px 20px; max-width: 1100px; margin: 0 auto;">
        <div class="feature-item" style="text-align: center; flex: 1; min-width: 200px;">
          <div style="font-size: 40px; margin-bottom: 12px;">🌍</div>
          <h3 style="margin: 0 0 6px;">Worldwide Shipping</h3>
          <p style="color: #888; margin: 0;">US, Japan, Europe & more</p>
        </div>
        <div class="feature-item" style="text-align: center; flex: 1; min-width: 200px;">
          <div style="font-size: 40px; margin-bottom: 12px;">🛡️</div>
          <h3 style="margin: 0 0 6px;">Quality Guaranteed</h3>
          <p style="color: #888; margin: 0;">Carefully sourced products</p>
        </div>
        <div class="feature-item" style="text-align: center; flex: 1; min-width: 200px;">
          <div style="font-size: 40px; margin-bottom: 12px;">💬</div>
          <h3 style="margin: 0 0 6px;">24/7 Support</h3>
          <p style="color: #888; margin: 0;">We're here to help</p>
        </div>
        <div class="feature-item" style="text-align: center; flex: 1; min-width: 200px;">
          <div style="font-size: 40px; margin-bottom: 12px;">↩️</div>
          <h3 style="margin: 0 0 6px;">30-Day Returns</h3>
          <p style="color: #888; margin: 0;">Hassle-free returns</p>
        </div>
      </section>

      <!-- Category Showcase -->
      <section class="categories" style="padding: 50px 20px; background: #f8f9fa;">
        <h2 style="text-align: center; font-size: 28px; margin-bottom: 35px;">Shop by Category</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1100px; margin: 0 auto;">
          <a href="/new" class="category-card" style="display: block; background: #fff; padding: 40px 30px; border-radius: 12px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: box-shadow 0.3s;">
            <h3 style="margin: 0 0 8px; font-size: 20px;">New Arrivals</h3>
            <p style="color: #888; margin: 0;">Discover what's new →</p>
          </a>
          <a href="/bestsellers" class="category-card" style="display: block; background: #fff; padding: 40px 30px; border-radius: 12px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: box-shadow 0.3s;">
            <h3 style="margin: 0 0 8px; font-size: 20px;">Bestsellers</h3>
            <p style="color: #888; margin: 0;">Shop trending products →</p>
          </a>
          <a href="/sale" class="category-card" style="display: block; background: #fff; padding: 40px 30px; border-radius: 12px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: box-shadow 0.3s;">
            <h3 style="margin: 0 0 8px; font-size: 20px;">Special Offers</h3>
            <p style="color: #888; margin: 0;">Limited time deals →</p>
          </a>
        </div>
      </section>

      <!-- Newsletter -->
      <section class="newsletter" style="padding: 60px 20px; text-align: center; max-width: 600px; margin: 0 auto;">
        <h2 style="font-size: 26px; margin-bottom: 10px;">Stay in the Loop</h2>
        <p style="color: #888; margin: 0 0 25px;">Get notified about new arrivals and exclusive offers</p>
        <form style="display: flex; gap: 10px; max-width: 450px; margin: 0 auto;">
          <input type="email" placeholder="Enter your email" required style="flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
          <button type="submit" style="padding: 12px 28px; background: #333; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer;">Subscribe</button>
        </form>
      </section>
    </div>

# ─── Category page description block ───
- title: Shop Our Collection
  identifier: category-description
  type: block
  active: true
  content: |
    <div class="category-intro" style="text-align: center; padding: 20px;">
      <p style="color: #666; font-size: 16px;">Browse our collection of quality products. Something for everyone!</p>
    </div>
