version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: magento_cj_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - magento_cj_network

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: magento_cj_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - magento_cj_network

  # 主应用服务
  app:
    build: .
    container_name: magento_cj_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - QUEUE_REDIS_HOST=redis
      - QUEUE_REDIS_PORT=${QUEUE_REDIS_PORT}
      - QUEUE_REDIS_DB=${QUEUE_REDIS_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DEBUG=${DEBUG}
      - HOST=0.0.0.0
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MAGENTO_BASE_URL=${MAGENTO_BASE_URL}
      - MAGENTO_API_TOKEN=${MAGENTO_API_TOKEN}
      - MAGENTO_API_USER=${MAGENTO_API_USER}
      - MAGENTO_API_PASSWORD=${MAGENTO_API_PASSWORD}
      - CJ_API_EMAIL=${CJ_API_EMAIL}
      - CJ_API_PASSWORD=${CJ_API_PASSWORD}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - magento_cj_network
    command: >
      sh -c "
        echo 'Waiting for MySQL to be ready...' &&
        while ! nc -z mysql 3306; do sleep 1; done &&
        echo 'Waiting for Redis to be ready...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Starting application...' &&
        python run.py
      "

volumes:
  mysql_data:
  redis_data:

networks:
  magento_cj_network:
    driver: bridge 