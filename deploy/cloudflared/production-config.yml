# Cloudflare Tunnel — 正式环境（阿里云 ECS）
# 注意: ECS 上的 cloudflared 应使用独立的 tunnel 和凭证
# 此文件为参考模板，实际配置在 ECS 上部署时生成

tunnel: YOUR_ECS_TUNNEL_ID
credentials-file: /etc/cloudflared/YOUR_ECS_TUNNEL_ID.json

ingress:
  # Magento 前台（阿里云 ECS 正式）
  - hostname: shop.yokileopard.com
    service: http://magento-project-web-1:80

  # 中间件 API（阿里云 ECS 正式）
  - hostname: mcj.yokileopard.com
    service: http://magento_cj_app:3000

  # 兜底
  - service: http_status:404
